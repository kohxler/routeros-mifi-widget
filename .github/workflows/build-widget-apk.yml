name: Build RouterOS MiFi Home Widget APK

on:
  workflow_dispatch:
  push:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Compile & Sign APK
        run: |
          SDK_ROOT=$ANDROID_HOME
          BUILD_TOOLS=$(ls -d $SDK_ROOT/build-tools/* | tail -n 1)
          PLATFORM=$(ls -d $SDK_ROOT/platforms/* | tail -n 1)
          mkdir -p build/gen build/obj build/apk
          $BUILD_TOOLS/aapt2 compile --dir app/src/main/res -o build/res.zip
          $BUILD_TOOLS/aapt2 link -o build/unaligned.apk -I $PLATFORM/android.jar \
            --manifest app/src/main/AndroidManifest.xml build/res.zip --java build/gen
          javac -source 1.8 -target 1.8 -bootclasspath $PLATFORM/android.jar \
            -d build/obj build/gen/com/custom/routerosmifi/widget/R.java \
            app/src/main/java/com/custom/routerosmifi/widget/MiFiWidgetProvider.java
          $BUILD_TOOLS/d8 --output build/apk build/obj/com/custom/routerosmifi/widget/*.class
          cd build/apk && zip -u ../unaligned.apk classes.dex && cd ../..
          $BUILD_TOOLS/zipalign -p 4 build/unaligned.apk build/aligned.apk
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=RouterOS MiFi,O=Custom,C=ID"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android \
            --out RouterOS-MiFi-Widget.apk build/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RouterOS-MiFi-Widget-APK
          path: RouterOS-MiFi-Widget.apk
